title: "AI Agents for Inventory Control Benchmark"
description: "A 1,320-instance benchmark for OR and LLM-based inventory agents on synthetic and real demand trajectories."

# GitHub Pages project URL (update if your username or repo name changes)
url: "https://brunofu.github.io"
baseurl: "/OR_Agent"

markdown: kramdown

collections:
  posts:
    output: false

# Exclude directories that shouldn't be part of the website
exclude:
  - examples/benchmark_website/
  - textarena/
  - examples/*_bench/
  - examples/_reference/
  - examples/benchmark_for_test/
  - examples/benchmark_all_strategies.py
  - examples/run_batch_benchmark.py
  - examples/*.py
  - "*.py"
  - "*.pyc"
  - "*.csv"
  - "*.txt"
  - "*.json"
  - .git/
  - .gitignore
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: page

